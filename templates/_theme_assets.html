    <link rel="stylesheet" href="{{ url_for('static', filename='css/light-auto.css', v=1) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark.css', v=2) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-ui.css', v=3) }}">
    <script type="application/json" id="theme-palettes">{{ theme_palettes|tojson }}</script>
