<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ heading }} | StudentHub AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=6) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css', v=19) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css', v=2) }}">
    {% include "_theme_assets.html" %}
</head>
<body>
    <nav class="navbar">
        <a class="logo" href="{{ url_for('home') }}">StudentHub AI</a>
        <ul class="nav-links">
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
            <li><a href="{{ url_for('notes') }}">Notes</a></li>
            <li><a href="{{ url_for('chatbot') }}">AI Career Mentor</a></li>
            {% include "_profile_menu.html" %}
        </ul>
    </nav>

    <header class="notes-flow-hero">
        <span class="section-kicker">ERROR {{ code }}</span>
        <h1>{{ heading }}</h1>
        <p>{{ message }}</p>
    </header>

    <main class="owner-upload-wrap error-page-actions">
        <a class="notes-primary-button" href="{{ url_for('home') }}">Go to Home</a>
        <a class="notes-reset-link" href="{{ url_for('notes') }}">Browse notes</a>
        <a class="notes-reset-link" href="{{ url_for('home') }}#suggestions">Report a problem</a>
    </main>

    <footer><p>© 2026 StudentHub AI | Developed by <strong>Utkarsh Jaiswal</strong></p></footer>
</body>
</html>
